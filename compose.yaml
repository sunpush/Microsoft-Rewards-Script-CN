services:
    ms_rewards:
        build:
            context: .
        image: ms_rewards:5.0.0
        container_name: ms_rewards_app_${NO}
        restart: unless-stopped
        stop_grace_period: 60s
        volumes:
            - ./config_${NO}:/usr/src/microsoft-rewards-script/config
            - ./diagnostics_${NO}:/usr/src/microsoft-rewards-script/diagnostics
            - ./sessions_${NO}:/usr/src/microsoft-rewards-script/sessions
        env_file:
            # Load account credentials from the .env file (ACCOUNT_1_EMAIL, optional ACCOUNT_1_PASSWORD, etc.)
            - path: .env
        environment:
            # ── Scheduler ──────────────────────────────────────
            TZ: ${TZ}
            NODE_ENV: 'production'
            # CRON_SCHEDULE is the *initial* default. It will run as default unless changed by the API
            # API schedule changes are saved to ./config/schedule.json, delete
            # that file to revert to the base CRON_SCHEDULE again.
            CRON_SCHEDULE: ${CRON_SCHEDULE} # use crontab.guru to customize your schedule
            RUN_ON_START: ${RUN_ON_START} # run script immediately on container start
            SKIP_RANDOM_SLEEP: 'false'
            #MIN_SLEEP_MINUTES: "5"
            #MAX_SLEEP_MINUTES: "50"
            #STUCK_PROCESS_TIMEOUT_HOURS: "8"

            # ── Control API server ──────────────────────────────────
            # API_MODE starts the Control API; it does not select the Rewards task transport.
            # Both API_MODE values support CONFIG_REWARDS_MODE=api or browser.
            #API_MODE: 'true'
            #API_TOKEN: '${API_TOKEN}'             # required for API mode, see env.example
            # API write/reveal capabilities are separate opt-ins and are off by default.
            #API_ALLOW_SCHEDULE_WRITE: 'true'
            #API_ALLOW_ENV_OVERRIDES: 'true'
            #API_ALLOW_CONFIG_REVEAL: 'true'
            #API_ALLOW_CONFIG_WRITE: 'true'

            #  ── Configuration ──────────────────────────────────────
            # Uncomment to override config.json settings; see README.md.
            #CONFIG_CLUSTERS: '1'
            # Rewards task transport: api (direct) or browser (page navigation and DOM clicks).
            #CONFIG_REWARDS_MODE: 'api'
            #CONFIG_ACCOUNT_DELAY_MIN: '1min'
            #CONFIG_ACCOUNT_DELAY_MAX: '3min'
            # Continue even if Microsoft reports Fraud_UserWarning_BotScore_UX (not recommended).
            #CONFIG_CONTINUE_ON_BOT_WARNING: 'false'
            # Block browser image/video/audio requests to reduce transferred media bytes.
            #CONFIG_EXPERIMENTAL_BLOCK_MEDIA: 'false'
            # Report the Edge browsing streak in the background (experimental).
            #CONFIG_EXPERIMENTAL_EDGE_BROWSING: 'false'
            # Only enable for a TLS-intercepting proxy whose certificate cannot be trusted normally.
            #CONFIG_PROXY_IGNORE_CERTIFICATE_ERRORS: 'false'
            #... add additional configuration overrides as needed
            CONFIG_SEARCH_DELAY_MIN: '2min'
            CONFIG_SEARCH_DELAY_MAX: '5min'
            CONFIG_SEARCH_READ_DELAY_MIN: '2min'
            CONFIG_SEARCH_READ_DELAY_MAX: '5min'
            CONFIG_SEARCH_SCROLL_RANDOM: 'true'
            CONFIG_SEARCH_CLICK_RANDOM: 'true'
            CONFIG_SEARCH_VISIT_TIME: '30sec'

        # ── Control API port mapping ──────────────────────────────
        # Uncomment when API_MODE=true
        #ports:
        #    - '127.0.0.1:3010:3010'

        healthcheck:
            test: ['CMD-SHELL', 'scripts/docker/healthcheck.sh']
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s

        security_opt:
            - no-new-privileges:true
